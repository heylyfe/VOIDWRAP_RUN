[package]
name = "server"
description = "VOIDWRAP RUN authoritative game server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "voidwrap-server"
path = "src/main.rs"

[features]
desktop = ["dep:wry", "dep:tao"]

[dependencies]
protocol.workspace = true
sim.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde.workspace = true
serde_json.workspace = true
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
igd-next = { version = "0.18", features = ["aio_tokio"] }


[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/protocol", "crates/sim", "crates/sim-wasm", "crates/server", "crates/matchmaker"]

[workspace.package]
version = "0.30.0-alpha.1"
edition = "2024"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
sim = { path = "crates/sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release.package.sim-wasm]
opt-level = "s"

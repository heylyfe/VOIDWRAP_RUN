name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: just verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: just verify

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t voidwrap-run .
      - name: Container serves the game
        run: |
          docker run -d --name vw -p 7878:7878 voidwrap-run
          for i in $(seq 1 30); do curl -fs http://localhost:7878/health && break; sleep 1; done
          curl -fs http://localhost:7878/ | grep -q "VOIDWRAP RUN"
          curl -fsI http://localhost:7878/sim.wasm | grep -qi "application/wasm"

